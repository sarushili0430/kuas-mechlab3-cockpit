# https://lefthook.dev/configuration/
pre-commit:
    parallel: true
    jobs:
        - name: lint
          run: pnpm lint

        - name: format
          run: pnpm format:check

        - name: test
          run: pnpm test

commit-msg:
    jobs:
        - name: commitlint
          run: pnpm exec commitlint --edit {1}
